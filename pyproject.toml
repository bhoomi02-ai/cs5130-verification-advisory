[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "advisory"
version = "0.1.0"
description = "CS 5130 Fall 2026: verification strategies for multi-agent financial advisory systems"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "pydantic>=2",
    "numpy",
    "numpy-financial",
    "pandas",
    "matplotlib",
]

[project.optional-dependencies]
dev = ["pytest"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
