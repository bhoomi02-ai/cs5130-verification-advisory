<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" width="1200" height="760" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" role="img" aria-labelledby="t d">
  <title id="t">Study design: one draft, six verification conditions, a hidden checker</title>
  <desc id="d">A scenario goes to the advisor, whose first draft is saved once and shared by every condition. Under each condition a verifier reviews the draft: accept keeps the draft, abstain or an unreadable reply sends it to human review, reject makes the advisor revise once and the same verifier checks the revision. A hidden checker grades the first draft and the final answer for metrics. Separately, every verifier reviews a seeded error set once, and a scorer-side module checks whether it named the actual error.</desc>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#4a5568"/>
    </marker>
    <style>
      .box{fill:#fff;stroke:#4a5568;stroke-width:1.4}
      .agent{fill:#ebf4ff;stroke:#3b6fb6;stroke-width:1.4}
      .score{fill:#fff7ed;stroke:#c2652a;stroke-width:1.4}
      .note{fill:#f7fafc;stroke:#a0aec0;stroke-width:1}
      .h{font-size:15px;font-weight:700;fill:#1a202c}
      .t{font-size:12.5px;fill:#2d3748}
      .s{font-size:11.5px;fill:#4a5568}
      .m{font-family:Menlo, Consolas, monospace;font-size:11px;fill:#4a5568}
      .sec{font-size:12px;font-weight:700;letter-spacing:.08em;fill:#718096}
      .ln{stroke:#4a5568;stroke-width:1.4;fill:none;marker-end:url(#a)}
      .lb{font-size:11.5px;font-weight:700}
    </style>
  </defs>

  <rect width="1200" height="760" fill="#ffffff"/>
  <text x="30" y="34" font-size="20" font-weight="700" fill="#1a202c">One draft, six ways to check it</text>
  <text x="30" y="54" class="s">Every condition reviews the same saved first draft, so differences in the final answers come from verification alone.</text>

  <!-- scorer-side region -->
  <rect x="800" y="70" width="380" height="590" rx="10" fill="#fffaf5" stroke="#c2652a" stroke-dasharray="6 5"/>
  <text x="816" y="92" class="sec" fill="#c2652a">SCORER SIDE · NEVER SHOWN TO AGENTS</text>

  <!-- column A: scenario, advisor, draft -->
  <text x="30" y="92" class="sec">TASK</text>
  <rect x="30" y="102" width="230" height="84" rx="8" class="box"/>
  <text x="44" y="124" class="h">Scenario</text>
  <text x="44" y="143" class="t">portfolio, policy, client request</text>
  <text x="44" y="160" class="m">data/scenarios/*.json</text>
  <text x="44" y="174" class="s">32 tasks in the main study</text>

  <rect x="30" y="214" width="230" height="78" rx="8" class="agent"/>
  <text x="44" y="236" class="h">Advisor</text>
  <text x="44" y="255" class="t">gemini-3.6-flash · prompt advisor-v1</text>
  <text x="44" y="272" class="s">temperature 0.7 · top-p 0.9</text>

  <rect x="30" y="326" width="230" height="84" rx="8" class="box"/>
  <text x="44" y="348" class="h">First draft</text>
  <text x="44" y="367" class="t">written once per task and repeat,</text>
  <text x="44" y="383" class="t">reused by every condition</text>
  <text x="44" y="398" class="m">results/drafts/</text>

  <path d="M145 186 V210" class="ln"/>
  <path d="M145 292 V322" class="ln"/>

  <!-- column B: conditions -->
  <text x="300" y="92" class="sec">VERIFICATION CONDITION (ONE PER RUN)</text>
  <rect x="300" y="102" width="470" height="150" rx="8" class="note"/>
  <g class="t">
    <text x="316" y="126"><tspan font-weight="700">none</tspan> · no review (baseline)</text>
    <text x="316" y="149"><tspan font-weight="700">self</tspan> · advisor re-checks its own answer</text>
    <text x="316" y="172"><tspan font-weight="700">peer</tspan> · independent call, same model</text>
    <text x="316" y="195"><tspan font-weight="700">dedicated</tspan> · separate verifier role + calculator (≤ 3 rounds)</text>
    <text x="316" y="218"><tspan font-weight="700">weakened</tspan> · dedicated without the calculator <tspan class="s">(ablation)</tspan></text>
    <text x="316" y="241"><tspan font-weight="700">cross_family</tspan> · dedicated played by gpt-oss-20b on Groq <tspan class="s">(ablation)</tspan></text>
  </g>

  <!-- review flow -->
  <path d="M260 365 H280 V299 H296" class="ln"/>
  <rect x="300" y="276" width="190" height="46" rx="8" class="agent"/>
  <text x="395" y="304" class="t" text-anchor="middle" font-weight="700">Verifier reviews draft</text>
  <text x="504" y="296" class="s">none skips the review:</text>
  <text x="504" y="311" class="s">final = draft, status <tspan class="m">unchecked</tspan></text>

  <path d="M395 322 V340 H360 V360" class="ln"/>
  <path d="M395 340 H535 V360" class="ln"/>
  <path d="M395 340 H700 V360" class="ln"/>

  <rect x="300" y="364" width="120" height="58" rx="8" class="box"/>
  <text x="360" y="384" class="lb" text-anchor="middle" fill="#2f855a">accept</text>
  <text x="360" y="401" class="s" text-anchor="middle">final = draft</text>
  <text x="360" y="415" class="m" text-anchor="middle">accepted</text>

  <rect x="440" y="364" width="190" height="58" rx="8" class="box"/>
  <text x="535" y="384" class="lb" text-anchor="middle" fill="#b7791f">abstain / unreadable</text>
  <text x="535" y="401" class="s" text-anchor="middle">final = draft</text>
  <text x="535" y="415" class="m" text-anchor="middle">human_review</text>

  <rect x="650" y="364" width="120" height="58" rx="8" class="agent"/>
  <text x="710" y="384" class="lb" text-anchor="middle" fill="#c53030">reject</text>
  <text x="710" y="401" class="s" text-anchor="middle">advisor revises</text>
  <text x="710" y="415" class="s" text-anchor="middle">once</text>

  <path d="M710 422 V450" class="ln"/>
  <rect x="470" y="454" width="300" height="62" rx="8" class="agent"/>
  <text x="620" y="476" class="t" text-anchor="middle" font-weight="700">Same verifier checks the revision</text>
  <text x="620" y="494" class="s" text-anchor="middle">final = revision · accept → <tspan class="m">revised</tspan></text>
  <text x="620" y="509" class="s" text-anchor="middle">otherwise → <tspan class="m">human_review</tspan></text>

  <!-- column C: checker, results, metrics -->
  <rect x="820" y="104" width="340" height="96" rx="8" class="score"/>
  <text x="836" y="127" class="h">Hidden checker</text>
  <text x="836" y="146" class="t">grades the first draft and the final answer</text>
  <text x="836" y="163" class="t">from the scenario's numbers and the answer key</text>
  <text x="836" y="182" class="m">checker.py · data/evaluation/</text>

  <rect x="820" y="230" width="340" height="80" rx="8" class="score"/>
  <text x="836" y="253" class="h">One row per run</text>
  <text x="836" y="272" class="t">initial / final correct, verdict, status, tokens, cost</text>
  <text x="836" y="290" class="m">results/results.jsonl · results/answers/</text>

  <rect x="820" y="340" width="340" height="110" rx="8" class="score"/>
  <text x="836" y="363" class="h">Metrics and report</text>
  <text x="836" y="382" class="t">task success (bootstrap CI over tasks)</text>
  <text x="836" y="399" class="t">catch rate, false alarms, MCC</text>
  <text x="836" y="416" class="t">fixed vs broken, paired difference vs none</text>
  <text x="836" y="433" class="t">cost per extra correct answer</text>

  <path d="M770 485 H788 V152 H816" class="ln"/>
  <text transform="translate(782 330) rotate(-90)" class="s" text-anchor="middle">first draft + final answer</text>
  <path d="M990 200 V226" class="ln"/>
  <path d="M990 310 V336" class="ln"/>

  <!-- seeded set band -->
  <line x1="30" y1="548" x2="770" y2="548" stroke="#e2e8f0"/>
  <text x="30" y="572" class="sec">SEEDED ERROR SET (VERIFIERS ONLY)</text>
  <rect x="30" y="582" width="230" height="82" rx="8" class="box"/>
  <text x="44" y="604" class="h">31 seeded answers</text>
  <text x="44" y="623" class="t">17 with one known error,</text>
  <text x="44" y="639" class="t">14 correct controls</text>
  <text x="44" y="655" class="m">data/injected/</text>

  <rect x="300" y="582" width="470" height="82" rx="8" class="agent"/>
  <text x="316" y="604" class="h">Each condition's verifier reviews each answer once</text>
  <text x="316" y="623" class="t">no revision · the verifier sees only the scenario and the answer</text>
  <text x="316" y="645" class="m">results/seeded/</text>

  <rect x="820" y="540" width="340" height="104" rx="8" class="score"/>
  <text x="836" y="563" class="h">Caught with the right reason?</text>
  <text x="836" y="582" class="t">catch rate and false alarms on known errors;</text>
  <text x="836" y="599" class="t">did the issues name the actual error?</text>
  <text x="836" y="617" class="m">right_reason.py</text>
  <text x="836" y="633" class="m">seeded_error_labels.csv</text>

  <path d="M260 623 H296" class="ln"/>
  <path d="M770 623 H795 V592 H816" class="ln"/>

  <!-- footer -->
  <rect x="30" y="690" width="1150" height="46" rx="8" class="note"/>
  <text x="46" y="711" class="t"><tspan font-weight="700">Every model call</tspan> goes through <tspan class="m">llm.py call_model()</tspan>: logged to <tspan class="m">results/runs.jsonl</tspan>, checked against the $20 spending cap.</text>
  <text x="46" y="727" class="s">Gemini API for the advisor and the Gemini verifiers · Groq for the cross_family verifier · exact model names, no aliases.</text>
</svg>
